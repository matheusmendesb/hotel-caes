<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel para Cães</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="./front-end/CSS/style.css">
</head>
<body>

    <aside class="sidebar">
        <h2>Hotel para Cães</h2>

        <nav>
            <a href="#" class="ativo">Inicio</a>
            <a href="#">Tutores</a>
            <a href="#">Cães</a>
            <a href="#">Hospedagens</a>
        </nav>
    </aside>

    <main class="conteudo">

        <header>
            <h1>Dashboard</h1>
            <p>Bem-vindo ao sistema do Hotel para Cães.</p>
        </header>

        <section class="cards">

            <div class="card">
                <h3>Tutores</h3>
                <p id="total-tutores">0</p>
            </div>

            <div class="card">
                <h3>Cães</h3>
                <p id="total-caes">0</p>
            </div>

            <div class="card">
                <h3>Hospedagens</h3>
                <p id="total-hospedagens">0</p>
            </div>

        </section>

    </main>

    <!-- Arquivo JavaScript principal -->
    <script type="module" src="./front-end/JS/script.js"></script>

</body>
</html>
