<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres para aceitar acentos. -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título exibido na aba do navegador. -->
    <title>Hotel para Cães</title>

    <!-- Importa o arquivo de estilos do projeto. -->
    <link rel="stylesheet" href="front-end/css/style.css">
</head>
<body>

    <!-- Menu lateral utilizado para navegar entre as páginas. -->
    <aside class="sidebar">
        <h2>Hotel para Cães</h2>

        <nav>
            <a href="#" class="ativo">Inicio</a>
            <a href="#">Tutores</a>
            <a href="#">Cães</a>
            <a href="#">Hospedagens</a>
        </nav>
    </aside>

    <!-- Área principal onde o conteúdo das páginas será exibido. -->
    <main class="conteudo">

        <!-- Cabeçalho inicial do Dashboard. -->
        <header>
            <h1>Dashboard</h1>
            <p>Bem-vindo ao sistema do Hotel para Cães.</p>
        </header>

        <!-- Cards que apresentam a quantidade de registros do sistema. -->
        <section class="cards">

            <div class="card">
                <h3>Tutores</h3>
                <p id="total-tutores">0</p>
            </div>

            <div class="card">
                <h3>Cães</h3>
                <p id="total-caes">0</p>
            </div>

            <div class="card">
                <h3>Hospedagens</h3>
                <p id="total-hospedagens">0</p>
            </div>

        </section>

    </main>

    <!-- Carrega o JavaScript principal como módulo.
         Ele controla a navegação e importa os demais arquivos JS. -->
    <script type="module" src="front-end/js/script.js"></script>

</body>
</html>
